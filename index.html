<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Личный трекер задач</title>
  <meta name="description" content="Личный таск-трекер: дашборд, таблица, доска и календарь.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;600&display=swap">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="ws-mark" id="wsMark">Л</div>
      <div style="min-width:0">
        <div class="ws-name" id="wsName">Личное пространство</div>
        <div class="ws-sub" id="wsSub">трекер задач</div>
      </div>
    </div>
    <div class="side-scroll" id="sideScroll"></div>
    <div class="side-foot">
      <div class="foot-row"><span>Прогресс</span><b id="pctTxt">0%</b></div>
      <div class="meter"><i id="meterFill" style="width:0%"></i></div>
      <div class="foot-row">
        <span>Открыто <b id="cOpen">0</b></span>
        <span>В работе <b id="cDoing">0</b></span>
        <span>Готово <b id="cDone">0</b></span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="icon-btn burger" id="burger" aria-label="Меню">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <div class="crumb" id="crumb"></div>
      <div style="flex:1"></div>
      <div class="search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" style="color:var(--text-faint);flex:0 0 13px"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14"/></svg>
        <input id="search" type="text" placeholder="Поиск задач…" aria-label="Поиск задач">
      </div>
      <button class="btn" id="cmdBtn" title="Командная палитра"><kbd>⌘K</kbd></button>
      <button class="btn btn--primary" id="newBtn">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v10M3 8h10"/></svg>
        Задача
      </button>
    </div>

    <div class="page-head">
      <h1 class="page-title" id="pageTitle">Все задачи</h1>
      <div class="page-sub" id="pageSub"></div>
      <div class="tabs" id="tabs"></div>
    </div>

    <div class="scroll"><div class="pad" id="view"></div></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="peek" id="peek" aria-label="Карточка задачи"></aside>

<div class="pal-wrap" id="palWrap">
  <div class="pal" role="dialog" aria-label="Командная палитра">
    <input class="pal-inp" id="palInp" type="text" placeholder="Найти задачу или создать новую…" autocomplete="off">
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> навигация</span><span><kbd>↵</kbd> открыть</span><span><kbd>esc</kbd> закрыть</span></div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>

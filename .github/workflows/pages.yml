name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Токен только на чтение кода и публикацию Pages — больше ничего не нужно.
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные выкатки не нужны: важна последняя.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка (внутри проверяются типы)
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

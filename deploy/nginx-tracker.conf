# Отдельный server-блок для трекера.
# Он не пересекается с остальными сайтами: своё имя, свой корень, свои логи.
# Класть в /etc/nginx/sites-available/ (или /etc/nginx/conf.d/) — deploy.sh делает это сам.

server {
    listen 80;
    listen [::]:80;

    server_name tracker.avdeevalexandr.ru;

    root /var/www/tracker;
    index index.html;

    access_log /var/log/nginx/tracker.access.log;
    error_log  /var/log/nginx/tracker.error.log;

    # приложение одностраничное: любой путь отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # имена файлов сборки содержат хеш — можно кешировать надолго
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # саму страницу не кешируем, иначе после деплоя останется старая версия
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
